<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · MarketLattice</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2358a6ff'/><stop offset='1' stop-color='%23b98fff'/></linearGradient></defs><rect width='32' height='32' rx='7' fill='url(%23g)'/><path d='M16 7L25 24L7 24Z' fill='%23fff'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('sec-theme')||'dark');</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#262624;--bg2:#1f1e1d;--bg3:#30302e;--border2:#3d3d3a;
  --text:#faf9f5;--text2:#c2bfb6;--text3:#8a8781;
  --accent:#d97757;--accent2:#c2603f;--purple:#a78bfa;--red-dim:rgba(224,122,95,.14);
  --shadow:rgba(0,0,0,.45);--err-text:#e07a5f;--glow:transparent;
  --serif:'Source Serif 4','Tiempos Text',Georgia,'Times New Roman',serif;
}
[data-theme="light"]{
  --bg:#faf9f5;--bg2:#f0eee6;--bg3:#ffffff;--border2:#dcd9cf;
  --text:#1f1e1d;--text2:#4a4843;--text3:#7d7a72;
  --accent:#c2603f;--accent2:#a84f31;--purple:#6d4aff;--red-dim:rgba(179,70,43,.09);
  --shadow:rgba(31,30,29,.1);--err-text:#b3462b;--glow:transparent;
}
#theme-btn{position:fixed;top:16px;right:16px;background:transparent;color:var(--text3);
  border:0;border-radius:8px;width:32px;height:32px;font-size:14px;
  cursor:pointer;line-height:1;display:flex;align-items:center;justify-content:center}
#theme-btn:hover{background:var(--bg3);color:var(--text)}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;
  min-height:100%;padding:24px;
}
.card{width:100%;max-width:384px;background:transparent;border:0;padding:0;animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:26px;text-align:center}
.logo{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:21px;line-height:1}
.brand h1{font-family:var(--serif);font-size:29px;font-weight:400;letter-spacing:-.015em;line-height:1.2}
.brand h1 span{color:inherit}
.brand p{font-size:14px;color:var(--text3);line-height:1.55;max-width:290px}
.err{background:var(--red-dim);border:1px solid var(--err-text);color:var(--err-text);
  font-size:13px;padding:10px 13px;border-radius:10px;text-align:center;margin-bottom:14px}
.err:empty{display:none}
form{display:flex;flex-direction:column;gap:12px}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:400;color:var(--text2);letter-spacing:0;text-transform:none}
.fld input{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;
  color:var(--text);font-size:15px;font-family:inherit;outline:none;transition:border-color .15s}
.fld input:focus{border-color:var(--accent)}
.fld input::placeholder{color:var(--text3)}
button{margin-top:6px;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;
  font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;transition:background .15s}
button:hover{background:var(--accent2)}
button:disabled{opacity:.55;cursor:default}
.foot{margin-top:22px;text-align:center;font-size:11.5px;color:var(--text3);line-height:1.5}
.tabs{display:flex;gap:2px;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;
  padding:3px;margin-bottom:16px}
.tab{flex:1;text-align:center;font-size:13px;font-weight:400;color:var(--text3);padding:7px 10px;
  border-radius:8px;cursor:pointer;transition:all .12s;user-select:none}
.tab:hover{color:var(--text)}
.tab.active{background:var(--bg3);color:var(--text)}
.tab.active.dev{background:var(--bg3);color:var(--purple)}
body.dev .logo{background:var(--purple)}
</style>
<script src="/config.js"></script>
</head>
<body>
  <button id="theme-btn" onclick="toggleTheme()" title="Toggle light / dark">☀️</button>
  <div class="card">
    <div class="brand">
      <div class="logo">◆</div>
      <h1>MarketLattice</h1>
      <p>Sign in to explore SEC 8-K filings, stock prices and world events.</p>
    </div>
    <div class="err"></div>
    <div class="tabs">
      <div class="tab active" id="tab-user" onclick="setMode('user')">Standard</div>
      <div class="tab" id="tab-dev" onclick="setMode('dev')">Developer</div>
    </div>
    <form method="POST" action="/login" autocomplete="off">
      <div class="fld">
        <label for="username">User ID</label>
        <input id="username" name="username" type="text" placeholder="Enter your user ID" autofocus required>
      </div>
      <div class="fld">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Enter your password" required>
      </div>
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
    <div class="foot">Authorized access only · MarketLattice 2026</div>
  </div>
  <script>function setThemeGlyph(){const t=document.documentElement.getAttribute('data-theme');const b=document.getElementById('theme-btn');if(b)b.textContent=(t==='dark')?'☀️':'🌙';}
function toggleTheme(){const next=(document.documentElement.getAttribute('data-theme')==='dark')?'light':'dark';document.documentElement.setAttribute('data-theme',next);localStorage.setItem('sec-theme',next);setThemeGlyph();}
setThemeGlyph();function setMode(mode){const dev=mode==='dev';document.body.classList.toggle('dev',dev);document.getElementById('tab-user').classList.toggle('active',!dev);const td=document.getElementById('tab-dev');td.classList.toggle('active',dev);td.classList.toggle('dev',dev);const u=document.getElementById('username');if(dev)u.value='ml-dev';else if(u.value==='ml-dev')u.value='';document.getElementById('submit-btn').innerHTML=dev?'Enter Developer Mode':'Sign in';document.getElementById('password').focus();}</script>

<script>document.querySelector('form').addEventListener('submit',async function(ev){ev.preventDefault();var btn=document.getElementById('submit-btn');var err=document.querySelector('.err');btn.disabled=true;err.textContent='';try{var resp=await fetch('/login',{method:'POST',headers:{'Accept':'application/json'},body:new URLSearchParams(new FormData(ev.target)),});var data=await resp.json().catch(function(){return{};});if(resp.ok&&data.token){localStorage.setItem('ml_session_token',data.token);location.href=data.must_change?'/settings':'/';return;}
err.textContent=data.error||('Sign-in failed (HTTP '+resp.status+').');}catch(e){err.textContent='Could not reach the backend at '+window.ML_API_BASE
+' — '+e.message;}
btn.disabled=false;});</script>
</body>
</html>
